services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./utils:/app/utils
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
