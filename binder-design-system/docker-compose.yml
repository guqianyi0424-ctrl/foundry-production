services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - checkpoints:/opt/checkpoints
    environment:
      - PYTHONPATH=/app/backend:/app
      - NVIDIA_VISIBLE_DEVICES=all
      - FOUNDRY_CHECKPOINT_DIRS=/opt/checkpoints
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  checkpoints:
